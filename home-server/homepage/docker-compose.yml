services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PUID: 1000
      # 983 = the host's `docker` group, not joecastagna's primary group.
      # The socket below is root:docker 660, so the container user must
      # carry that group or every Docker status lookup fails with EACCES.
      PGID: 983
      HOMEPAGE_ALLOWED_HOSTS: 'homepage.local:3001,homepage.home,homepage.home:3001,192.168.0.186:3001'
      # Both sourced from ~/apps/homepage/.env on the server (never committed):
      # PIHOLE_PASSWORD=... and HA_TOKEN=...
      HOMEPAGE_VAR_PIHOLE_PASSWORD: '${PIHOLE_PASSWORD}'
      HOMEPAGE_VAR_HA_TOKEN: '${HA_TOKEN}'
    volumes:
      - ./config:/app/config
      # read-only: enables container auto-discovery/status widget, no start/stop control.
      - /var/run/docker.sock:/var/run/docker.sock:ro
