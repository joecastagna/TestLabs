- id: mets_game_start_gemini
  alias: Mets Game Start - Gemini Notification
  description: AI-generated push notification and TTS when Mets game starts
  triggers:
  - platform: state
    entity_id: sensor.mlb_new_york_mets
    to: IN
    from: PRE
  conditions: []
  actions:
  - data:
      instructions: 'Write a short punchy announcement (1-2 sentences, no hashtags)
        for a passionate Mets fan. The New York Mets (record: {{ state_attr(''sensor.mlb_new_york_mets'',
        ''team_record'') }}) are playing at {{ state_attr(''sensor.mlb_new_york_mets'',
        ''team_homeaway'') }} against the {{ state_attr(''sensor.mlb_new_york_mets'',
        ''opponent_name'') }} (record: {{ state_attr(''sensor.mlb_new_york_mets'',
        ''opponent_record'') }}). On TV: {{ state_attr(''sensor.mlb_new_york_mets'',
        ''tv_network'') }}.'
      entity_id: ai_task.google_ai_task
      task_name: Mets Game Start Announcement
    response_variable: gemini_response
    action: ai_task.generate_data
  - data:
      title: ⚾ Mets Game Time!
      message: '{{ gemini_response.data }}'
    action: notify.mobile_app_joe_castagnas_iphone_14_max_2022
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.bedroom_speaker
      message: '{{ gemini_response.data }}'
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.kitchen_speaker
      message: '{{ gemini_response.data }}'
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.office_speaker
      message: '{{ gemini_response.data }}'
  mode: single
- id: mets_score_gemini
  alias: Mets Score - Gemini Notification
  description: AI-generated push notification and TTS when Mets score
  triggers:
  - platform: state
    entity_id: sensor.mlb_new_york_mets
    attribute: team_score
  conditions:
  - condition: state
    entity_id: sensor.mlb_new_york_mets
    state: IN
  - condition: template
    value_template: '{{ state_attr(''sensor.mlb_new_york_mets'', ''team_score'') |
      int > 0 }}'
  actions:
  - data:
      instructions: 'Write a one-sentence exciting announcement (no hashtags) for
        a Mets fan who just scored. Current score: Mets {{ state_attr(''sensor.mlb_new_york_mets'',
        ''team_score'') }}, {{ state_attr(''sensor.mlb_new_york_mets'', ''opponent_name'')
        }} {{ state_attr(''sensor.mlb_new_york_mets'', ''opponent_score'') }}. Inning:
        {{ state_attr(''sensor.mlb_new_york_mets'', ''clock'') }}.'
      entity_id: ai_task.google_ai_task
      task_name: Mets Score Update
    response_variable: gemini_response
    action: ai_task.generate_data
  - data:
      title: "\U0001F3C3 Mets Score!"
      message: '{{ gemini_response.data }}'
    action: notify.mobile_app_joe_castagnas_iphone_14_max_2022
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.bedroom_speaker
      message: '{{ gemini_response.data }}'
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.kitchen_speaker
      message: '{{ gemini_response.data }}'
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.office_speaker
      message: '{{ gemini_response.data }}'
  mode: single
- id: mets_game_end_gemini
  alias: Mets Game End - Gemini Notification
  description: AI-generated push notification and TTS with final score
  triggers:
  - entity_id: sensor.mlb_new_york_mets
    to: POST
    from: IN
    trigger: state
  conditions: []
  actions:
  - data:
      task_name: Mets Game End Announcement
      instructions: 'Write a short announcement (1-2 sentences, no hashtags) for a
        Mets fan about the final result. Final score: Mets {{ state_attr(''sensor.mlb_new_york_mets'',
        ''team_score'') }}, {{ state_attr(''sensor.mlb_new_york_mets'', ''opponent_name'')
        }} {{ state_attr(''sensor.mlb_new_york_mets'', ''opponent_score'') }}. {%
        if state_attr(''sensor.mlb_new_york_mets'', ''team_score'') | int > state_attr(''sensor.mlb_new_york_mets'',
        ''opponent_score'') | int %}The Mets won — be celebratory!{% else %}The Mets
        lost — be sympathetic but encouraging.{% endif %}'
      entity_id: ai_task.google_ai_task
    response_variable: gemini_response
    action: ai_task.generate_data
  - data:
      title: ⚾ Mets Final
      message: '{{ gemini_response.data }}'
    action: notify.mobile_app_joe_castagnas_iphone_14_max_2022
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.bedroom_speaker
      message: '{{ gemini_response.data }}'
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.kitchen_speaker
      message: '{{ gemini_response.data }}'
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.office_speaker
      message: '{{ gemini_response.data }}'
- id: fifa_wc_kickoff_5min
  alias: FIFA World Cup - Kickoff in 5 Minutes
  description: Gemini notification + TTS 5 minutes before any World Cup game
  triggers:
  - value_template: '{% set events = state_attr(''sensor.fifa_world_cup_scoreboard'',
      ''events'') %}{% if events and events | length > 0 %}{% set ns = namespace(found=false)
      %}{% for e in events %}{% if e.status.type.state == ''pre'' %}{% set game_time
      = as_datetime(e.date) %}{% set mins_away = ((game_time - now()).total_seconds()
      / 60) | int %}{% if mins_away >= 4 and mins_away <= 6 %}{% set ns.found = true
      %}{% endif %}{% endif %}{% endfor %}{{ ns.found }}{% else %}false{% endif %}'
    trigger: template
  conditions: []
  actions:
  - data:
      instructions: '{% set events = state_attr(''sensor.fifa_world_cup_scoreboard'',
        ''events'') %}{% set ns = namespace(game=''the upcoming match'') %}{% if events
        %}{% for e in events %}{% if e.status.type.state == ''pre'' %}{% set ns.game
        = e.name %}{% endif %}{% endfor %}{% endif %}Write a short exciting push notification
        (1-2 sentences, no hashtags) for a soccer fan. The FIFA World Cup match {{
        ns.game }} kicks off in 5 minutes!'
      entity_id: ai_task.google_ai_task
      task_name: World Cup Kickoff Alert
    response_variable: gemini_response
    action: ai_task.generate_data
  - data:
      title: ⚽ World Cup Kickoff in 5!
      message: '{{ gemini_response.data }}'
    action: notify.mobile_app_joe_castagnas_iphone_14_max_2022
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.kitchen_speaker
      message: '{{ gemini_response.data }}'
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.office_speaker
      message: '{{ gemini_response.data }}'
  mode: single
