- id: office_off_weeknights
  alias: Office Off Weeknights
  description: Announce then turn off all office devices at 2:00 AM Sun-Thu, unless
    cancelled by voice
  triggers:
  - trigger: time
    at: 02:00:00
  conditions:
  - condition: time
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.im_awake
  - action: tts.speak
    target:
      entity_id: tts.google_translate_en_com
    data:
      media_player_entity_id: media_player.office_speaker
      message: It's getting late. I'm going to shut everything down in the office
        in two minutes. If you're working, just say, Hey Google, turn on I'm awake.
  - delay:
      minutes: 2
  - condition: state
    entity_id: input_boolean.im_awake
    state: 'off'
  - action: light.turn_off
    target:
      entity_id:
      - light.office_corner_lamp
      - light.office_office_floor_lamp
      - light.office_office_top_2
      - light.office_joes_lamp
      - light.office_office_top_1
      - light.office_office
  - action: media_player.turn_off
    target:
      entity_id:
      - media_player.office_speaker
      - media_player.office_speakers
  - action: switch.turn_off
    target:
      entity_id:
      - switch.oak
      - switch.glitter
      - switch.christmas_tree
  mode: single
