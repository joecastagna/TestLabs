- id: fifa_wc_game_start
  alias: FIFA World Cup - Game Start
  description: Gemini notification + TTS when any World Cup game kicks off
  triggers:
  - platform: template
    value_template: '{% set events = state_attr(''sensor.fifa_world_cup_scoreboard'',
      ''events'') %}{% if events and events | length > 0 %}{% set ns = namespace(found=false)
      %}{% for e in events %}{% if e.status.type.state == ''in'' and e.status.type.description
      == ''In Progress'' and e.status.displayClock == ''0:00'' %}{% set ns.found =
      true %}{% endif %}{% endfor %}{{ ns.found }}{% else %}false{% endif %}'
  conditions: []
  actions:
  - data:
      instructions: '{% set events = state_attr(''sensor.fifa_world_cup_scoreboard'',
        ''events'') %}{% set ns = namespace(game=''the match'') %}{% if events %}{%
        for e in events %}{% if e.status.type.state == ''in'' %}{% set ns.game = e.name
        %}{% endif %}{% endfor %}{% endif %}Write a short exciting push notification
        (1-2 sentences, no hashtags) announcing that the FIFA World Cup match {{ ns.game
        }} has just kicked off! Make it electric!'
      entity_id: ai_task.google_ai_task
      task_name: World Cup Game Start Announcement
    response_variable: gemini_response
