server.port=8080
server.address=0.0.0.0
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false

spring.datasource.url=jdbc:postgresql://yugabytedb:5433/yugabyte
spring.datasource.username=yugabyte
spring.datasource.password=yugabyte
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.connect-retries=30
spring.flyway.connect-retries-interval=10

spring.jackson.serialization.write-dates-as-timestamps=false

app.upload.dir=/app/uploads
app.classifier.url=http://classifier:8001
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8180/realms/catsnap

spring.mail.host=mailhog
spring.mail.port=1025

# In production, override via APP_JWT_SECRET env var with a random 32+ byte value
app.jwt.secret=catsnap-dev-signing-key-for-development-only
app.jwt.expiration-ms=86400000
